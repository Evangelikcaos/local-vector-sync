name: Test LocalVectorSync

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck, unit tests, and build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust crate tests (native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml --locked

  wasm-bindings-in-sync:
    name: Verify committed WASM bindings match rust/src
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen-cli
        run: |
          version=$(grep -m1 '^name = "wasm-bindgen"' -A1 rust/Cargo.lock | grep version | sed -E 's/.*"(.*)"/\1/')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Rebuild bindings into a scratch dir and diff against src/wasm
        run: |
          cd rust
          cargo build --target wasm32-unknown-unknown --release --locked
          wasm-bindgen --target nodejs --out-dir /tmp/wasm-check --out-name local_vector_sync_core target/wasm32-unknown-unknown/release/local_vector_sync_core.wasm
          cd ..
          # Compare the generated JS/TS glue (source of truth for behavior).
          # The .wasm binary itself can differ byte-for-byte between
          # toolchain patch versions even with identical source, so only
          # the human-authored-shaped glue files are diffed exactly here.
          diff -u src/wasm/local_vector_sync_core.js /tmp/wasm-check/local_vector_sync_core.js
          diff -u src/wasm/local_vector_sync_core.d.ts /tmp/wasm-check/local_vector_sync_core.d.ts
