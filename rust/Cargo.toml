[package]
name = "local-vector-sync-core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM accelerated hot-path (cosine similarity + top-K search) for local-vector-sync"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
